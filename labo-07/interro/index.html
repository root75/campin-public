<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interro Labo 07</title>
<!-- Page d'accueil de l'interro du Labo 07, sous Safe Exam Browser : le numéro du poste choisit la série A, B ou C
     (postes 1, 4, 7… → A ; 2, 5, 8… → B ; 3, 6, 9… → C), donc deux voisins n'ont jamais la même.
     Les trois liens viennent du journal de creerEval (campin-pedagogique/cours/3ttr-labo/sequences/07-coulisses-pc/forms/). -->
<style>
:root{--fond:#F4F6F9;--texte:#202020;--bleu:#1F4E79;--doux:#6B7280;--carte:#fff}
body{font-family:Calibri,"Segoe UI",system-ui,sans-serif;background:var(--fond);color:var(--texte);margin:0;
     min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center}
main{max-width:560px;padding:32px 16px}
h1{font-size:28px;margin:0 0 8px;color:var(--bleu)}
p{font-size:19px;line-height:1.5;margin:10px 0}
label{display:block;font-size:19px;margin:18px 0 8px}
input{font:inherit;font-size:28px;width:5ch;text-align:center;padding:6px;border:2px solid var(--bleu);border-radius:8px}
a.btn{display:inline-block;margin-top:18px;background:var(--bleu);color:#fff;text-decoration:none;font-size:22px;
      padding:14px 26px;border-radius:10px}
.note{color:var(--doux);font-size:16px;margin-top:22px}
</style></head>
<body><main>
<h1>Interro — Labo 07</h1>
<p>Dans les coulisses du PC · sur 20 · environ 40 minutes</p>
<label for="poste">Le numéro de ton poste (collé sur l’écran : EC1-PC-…)</label>
<input id="poste" inputmode="numeric" autocomplete="off" maxlength="2" aria-describedby="serie">
<p id="serie" aria-live="polite"></p>
<p class="note">Écris le numéro de TON poste : le professeur le vérifie dans ta réponse.</p>
</main>
<script>
// Les liens élèves des trois Forms (« lien élève » dans le journal de creerEval). Vide = épreuve pas encore ouverte.
const LIENS = {
  A: "https://docs.google.com/forms/d/e/1FAIpQLSfD3w5LBjrNhgHMF_J29JIe4reLERtkC1v8WU6LwDRYzdKq-A/viewform",
  B: "https://docs.google.com/forms/d/e/1FAIpQLSc_T5zNB1A0xMU_tGDiY9yZ9oOXC3kH637nnCZYi1Pa6eDq8g/viewform",
  C: "https://docs.google.com/forms/d/e/1FAIpQLSeJm0TQ9eeeXteeLJEjnuV4T_Ii3ATCDFSzH8TnR5brH82oVg/viewform"
};
const champ = document.getElementById("poste"), sortie = document.getElementById("serie");
champ.addEventListener("input", () => {
  const n = Number(champ.value.replace(/\D/g, ""));
  sortie.replaceChildren();
  if (!n) return;
  const s = "ABC"[(n - 1) % 3];
  if (!LIENS[s]) { sortie.textContent = "Série " + s + " : l’épreuve n’est pas encore ouverte. Attends le signal du professeur."; return; }
  const a = document.createElement("a");
  a.className = "btn"; a.href = LIENS[s]; a.textContent = "Commencer la série " + s;
  sortie.append(a);
});
</script>
</body></html>
