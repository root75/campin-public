# Vérification automatique : chaque PR (et chaque fusion dans main) lance tous les tests de tests/.
# Aucun secret, aucune dépendance : les tests n'utilisent que Node.
# Les essais avec le vrai Code.gs tournent dans campin-pedagogique (dépôt privé).
# Second travail, « cours » : chaque étape de chaque cours du catalogue est ouverte dans Chromium
# (outils/verifier-cours.cjs) ; un constat nouveau fait échouer la PR.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: node tests/*.cjs
        run: |
          echec=0
          for t in tests/*.cjs; do
            echo "::group::$t"
            node "$t" || { echec=1; echo "::error file=$t::$t échoue"; }
            echo "::endgroup::"
          done
          exit $echec

  cours:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          # Sans --with-deps : le runner a déjà les bibliothèques de Chromium (leçon du dépôt privé : le job tombait
          # quand le miroir Ubuntu ne répondait pas).
          npx playwright install chromium
      - name: node outils/verifier-cours.cjs --reseau
        run: node outils/verifier-cours.cjs --reseau
      - name: Le cours modèle, généré depuis sa fiche puis ouvert étape par étape
        run: |
          cp -r . "$RUNNER_TEMP/essai"
          node outils/nouveau-cours.cjs pas-a-pas/modele/sequence.json --racine "$RUNNER_TEMP/essai"
          cd "$RUNNER_TEMP/essai" && node outils/verifier-cours.cjs modele
